[workspace]
resolver = '3'
members = [
    "cxx-kde-frameworks",

    "examples/simplemdviewer",
    "examples/simplemdviewer-qtbridge",
    "examples/kontrast",
    "examples/kapp"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
cxx = "1.0.192"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-lib-extras = { version = "0.10.0" }
qtbridge = "0.4.1"
qtbridge-type-lib = "0.4.1"
cxx-kde-frameworks = { path = "cxx-kde-frameworks" }
# build dependencies
cmake-package = "0.3.1"
cxx-qt-build = { version = "0.10.0" }
